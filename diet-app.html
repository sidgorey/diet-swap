            var card = "<div class=\"card\">\
                <img src=\"\" class=\"card-img-top\" alt=\""+ f.name + "\">\
                <div class=\"card-body\">\
                  <h4 class=\"card-title\">" + f.alt + "</h4>\
                  <p class=\"card-text\">" + f.recipe +"</p>\
                </div>\
                </div>";

                $(card).appendTo(".d-flex");
        }

        $('#submit-button').click((e) => {
            jsonNew = filter(json,$('#input-search').val());
            console.log(jsonNew);
            $('.d-flex').empty();
            $(jsonNew.data).each((i, f) => {
                renderCards(f);
            });
        })
